<!doctype html>
<html lang="ja" data-ls-dark="auto">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>学習者の進み具合｜LearningPlatform 管理</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#f4efe6" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#121614" media="(prefers-color-scheme: dark)">
    <!-- Q キット（おくるんの共通部品）。色は下の :root で、今の緑に -->
    <link rel="stylesheet" href="https://katsuan.github.io/line-share/shared/ui.css">
    <link rel="stylesheet" href="./admin.css?v=20261025">
  </head>
  <body>
    <main class="ls-page admin-page ls-stack">
      <header class="ls-brand">
        <h1 class="ls-brand-name">📊 学習者の進み具合</h1>
        <button id="refreshButton" class="ls-icon-button" type="button" aria-label="最新にする">🔄</button>
      </header>
      <p class="ls-brand-copy">だれが、どれだけ解いたかを見られます</p>

      <section id="gatePanel" class="ls-panel" hidden aria-live="polite"></section>

      <section id="statsPanel" class="stats" aria-label="まとめ">
        <div class="stat"><span class="stat-label">学習者</span><span id="learnerCount" class="stat-value">—</span></div>
        <div class="stat"><span class="stat-label">答えた数</span><span id="totalAnswered" class="stat-value">—</span></div>
        <div class="stat"><span class="stat-label">平均の正答率</span><span id="averageAccuracy" class="stat-value">—</span></div>
      </section>

      <div id="layoutPanel" class="layout">
        <section class="ls-panel" aria-labelledby="listTitle">
          <h2 id="listTitle" class="ls-panel-title">👥 学習者</h2>
          <div id="learnerList" class="ls-list"></div>
        </section>

        <section id="detailPanel" class="ls-panel" aria-labelledby="detailTitle">
          <h2 id="detailTitle" class="ls-panel-title">📝 くわしく</h2>
          <div id="learnerDetail" class="ls-stack"></div>
        </section>
      </div>

      <details id="debugPanel" class="ls-fold" hidden>
        <summary>開発ログ</summary>
        <div class="ls-fold-body">
          <pre id="responsePanel">まだリクエストは実行されていません。</pre>
        </div>
      </details>
    </main>

    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="./config.js"></script>
    <script src="./admin.js?v=20261025"></script>
  </body>
</html>
