<!doctype html>
<html lang="ja" data-ls-dark="auto">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>今日の5問｜LearningPlatform</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#f4efe6" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#121614" media="(prefers-color-scheme: dark)">
    <!-- Q キット（おくるんの共通部品）。色は下の :root で、今の緑に -->
    <link rel="stylesheet" href="https://katsuan.github.io/line-share/shared/ui.css">
    <link rel="stylesheet" href="./learn.css?v=20261025">
  </head>
  <body>
    <main class="ls-page ls-stack">
      <header class="ls-brand">
        <h1 class="ls-brand-name">📚 今日の5問</h1>
        <button id="soundToggleButton" class="ls-icon-button sound-button" type="button" aria-pressed="true" aria-label="効果音">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path class="speaker-fill" d="M3 10.4h4.5l5-4.1c.5-.4 1.2 0 1.2.6v10.2c0 .6-.7 1-1.2.6l-5-4.1H3.9c-.5 0-.9-.4-.9-.9v-1.4c0-.5.4-.9.9-.9Z"></path>
            <path class="speaker-wave" d="M16.6 9.1c1 .8 1.6 1.9 1.6 2.9s-.6 2.1-1.6 2.9"></path>
            <path class="speaker-wave" d="M18.9 6.9c1.6 1.4 2.6 3.2 2.6 5.1s-1 3.7-2.6 5.1"></path>
            <path class="speaker-slash" d="M16.7 7.3 21 16.7"></path>
          </svg>
        </button>
      </header>
      <p class="ls-brand-copy">1問ずつ答えて、すぐ答え合わせ</p>

      <section class="ls-panel progress-panel" aria-label="進み具合">
        <div class="progress-head">
          <span id="progressLabel">今日の5問</span>
          <span id="progressCount" class="progress-count">—</span>
        </div>
        <div class="progress-bar" aria-hidden="true"><div id="progressFill" class="progress-fill"></div></div>
        <nav id="questionMap" class="ls-chips qmap" aria-label="問題の番号"></nav>
      </section>

      <div id="questionShell" class="ls-stack"></div>

      <p id="versionText" class="version">ver -</p>

      <details id="debugPanel" class="ls-fold" hidden>
        <summary>開発ログ</summary>
        <div class="ls-fold-body">
          <pre id="responsePanel" class="debug-log">まだリクエストは実行されていません。</pre>
        </div>
      </details>
    </main>

    <script src="https://katsuan.github.io/line-share/shared/ui.js"></script>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="./config.js"></script>
    <script src="./learn.js?v=20261025"></script>
  </body>
</html>
