name: Update Version Json

on:
  push:
    branches:
      - main
    paths-ignore:
      - docs/version.json

permissions:
  contents: write

jobs:
  update-version-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write version file
        env:
          COMMIT_SHA: ${{ github.sha }}
          GENERATED_AT: ${{ github.event.head_commit.timestamp }}
        run: |
          short_sha="${COMMIT_SHA::7}"
          cat <<EOF > docs/version.json
          {
            "version": "${short_sha}",
            "commit": "${COMMIT_SHA}",
            "generatedAt": "${GENERATED_AT}"
          }
          EOF

      - name: Commit version file
        run: |
          if git diff --quiet -- docs/version.json; then
            echo "No version change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/version.json
          git commit -m "chore: update version json [skip ci]"
          git push
